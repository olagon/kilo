<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Huli spot review</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; background: #0A1A24; color: #EEF5F3; }
  #map { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; top: 12px; background: rgba(10,26,36,.85); padding: 10px 14px; border-radius: 12px; max-width: 360px; }
  #hud b { color: #F2A900; }
  #help { position: absolute; left: 12px; bottom: 12px; background: rgba(10,26,36,.85); padding: 8px 12px; border-radius: 12px; opacity: .8; }
  button { background: #0B4F6C; color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; margin-top: 6px; cursor: pointer; }
  .rejected { color: #D7263D; } .approved { color: #3F7D3A; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div id="info">Loading…</div>
  <button id="download">Download decisions</button>
</div>
<div id="help">A approve · R reject · 1-5 difficulty · ← → step · drag to look</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
const USGS = 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}';
const TERRAIN = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
let spots = [], i = Number(localStorage.getItem('huli-review-i') || 0);
const decisions = JSON.parse(localStorage.getItem('huli-review-decisions') || '{}');

const map = new maplibregl.Map({
  container: 'map', center: [-157.8, 21.3], zoom: 15, pitch: 55, maxPitch: 70,
  style: {
    version: 8,
    sources: {
      sat: { type: 'raster', tiles: [USGS], tileSize: 256, maxzoom: 16, attribution: 'USGS The National Map' },
      dem: { type: 'raster-dem', tiles: [TERRAIN], tileSize: 256, encoding: 'terrarium', maxzoom: 15 },
    },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }],
    terrain: { source: 'dem', exaggeration: 1.3 },
  },
});

function show() {
  const s = spots[i]; if (!s) return;
  const d = decisions[s.id] || {};
  map.jumpTo({ center: [s.lon, s.lat], zoom: s.zoom ?? 16.5, pitch: s.pitch ?? 55, bearing: s.bearing ?? 0 });
  const status = d.status || s.status;
  document.getElementById('info').innerHTML =
    `<b>${i + 1} / ${spots.length}</b> · id ${s.id}<br><b>${s.placeName}</b><br>near ${s.near ?? '—'} · ${s.island}<br>` +
    `difficulty <b>${d.difficulty ?? s.difficulty}</b> · <span class="${status}">${status}</span>` +
    (s.funFact ? `<br><i>${s.funFact}</i>` : '');
  localStorage.setItem('huli-review-i', i);
}
function decide(patch) {
  const s = spots[i]; decisions[s.id] = { id: s.id, status: s.status, difficulty: s.difficulty, ...decisions[s.id], ...patch };
  localStorage.setItem('huli-review-decisions', JSON.stringify(decisions)); show();
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { i = Math.min(i + 1, spots.length - 1); show(); }
  else if (e.key === 'ArrowLeft') { i = Math.max(i - 1, 0); show(); }
  else if (e.key === 'a' || e.key === 'A') { decide({ status: 'approved' }); i = Math.min(i + 1, spots.length - 1); show(); }
  else if (e.key === 'r' || e.key === 'R') { decide({ status: 'rejected' }); i = Math.min(i + 1, spots.length - 1); show(); }
  else if (/^[1-5]$/.test(e.key)) decide({ difficulty: Number(e.key) });
});
document.getElementById('download').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(Object.values(decisions), null, 2)], { type: 'application/json' }));
  a.download = 'decisions.json'; a.click();
};
fetch('../pool-builder/out/spots.json').then((r) => r.json()).then((j) => { spots = j; map.once('load', show); if (map.loaded()) show(); });
</script>
</body>
</html>
