name: Deploy API
on:
  push:
    branches: [main]
    paths: ['services/api/**', 'packages/shared/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Needs a CLOUDFLARE_API_TOKEN repo secret with Workers and D1 edit rights.
    if: ${{ vars.DEPLOY_API == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cd services/api && npx wrangler d1 migrations apply huli --remote
        env: { CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} }
      - run: cd services/api && npx wrangler deploy
        env: { CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} }
