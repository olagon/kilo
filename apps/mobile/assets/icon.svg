<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sea" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#15617f"/>
      <stop offset="0.55" stop-color="#0b4f6c"/>
      <stop offset="1" stop-color="#071a26"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa65a"/>
      <stop offset="1" stop-color="#2f6b2c"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ccf88"/>
      <stop offset="1" stop-color="#3f7d3a"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#e59a00"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- ocean -->
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <!-- swell lines, very quiet -->
  <g fill="none" stroke="#eef5f3" stroke-opacity="0.07" stroke-width="6">
    <path d="M-20 700 Q 160 660 330 700 T 680 700 T 1044 700"/>
    <path d="M-20 790 Q 160 750 330 790 T 680 790 T 1044 790"/>
    <path d="M-20 880 Q 160 840 330 880 T 680 880 T 1044 880"/>
  </g>
  <!-- island: one bold green mass with a ridge, tilted like the sky view -->
  <g filter="url(#shadow)">
    <path fill="url(#land)" d="M150 560 C 150 470, 250 420, 360 430 C 440 436, 470 400, 560 392 C 680 382, 800 440, 860 520 C 910 590, 870 680, 760 700 C 640 722, 560 690, 470 700 C 360 712, 260 700, 200 660 C 165 636, 150 600, 150 560 Z"/>
    <!-- reef/shallows glow along the shore -->
    <path fill="none" stroke="#9fe3e8" stroke-opacity="0.35" stroke-width="22" filter="url(#soft)" d="M150 560 C 150 470, 250 420, 360 430 C 440 436, 470 400, 560 392 C 680 382, 800 440, 860 520 C 910 590, 870 680, 760 700 C 640 722, 560 690, 470 700 C 360 712, 260 700, 200 660 C 165 636, 150 600, 150 560 Z"/>
  </g>
  <!-- mountain ridge -->
  <path fill="url(#ridge)" d="M330 560 L 410 470 L 470 520 L 540 440 L 620 520 L 690 480 L 750 570 C 640 590, 480 600, 330 560 Z"/>
  <path fill="#1f4d20" fill-opacity="0.7" d="M410 470 L 470 520 L 440 560 L 380 548 Z M540 440 L 620 520 L 560 575 L 500 540 Z"/>
  <!-- the pin: big, warm, unmistakable at 48px -->
  <g filter="url(#shadow)">
    <path fill="url(#pin)" d="M512 250 C 418 250, 352 320, 352 410 C 352 520, 512 690, 512 690 C 512 690, 672 520, 672 410 C 672 320, 606 250, 512 250 Z"/>
    <circle cx="512" cy="412" r="66" fill="#0a1a24"/>
    <circle cx="512" cy="412" r="36" fill="#eef5f3"/>
  </g>
</svg>
