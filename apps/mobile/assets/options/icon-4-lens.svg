<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0a1a24"/>
  <!-- kilo means to watch, observe: a round lens with a mountain inside and the dot as the fix -->
  <circle cx="512" cy="512" r="400" fill="#0b4f6c"/>
  <clipPath id="c"><circle cx="512" cy="512" r="400"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="112" y="112" width="800" height="800" fill="#2a8fb5" fill-opacity="0.25"/>
    <path fill="#1e5a52" d="M80 760 L240 540 L360 640 L512 420 L660 600 L780 520 L944 760 L944 950 L80 950 Z"/>
    <path fill="#2f6b2c" d="M80 860 L200 740 L340 800 L512 660 L690 790 L820 720 L944 820 L944 950 L80 950 Z"/>
  </g>
  <circle cx="512" cy="512" r="400" fill="none" stroke="#eef5f3" stroke-width="26"/>
  <!-- tick marks like a sight -->
  <g stroke="#eef5f3" stroke-width="22" stroke-linecap="round">
    <line x1="512" y1="92" x2="512" y2="160"/><line x1="512" y1="864" x2="512" y2="932"/>
    <line x1="92" y1="512" x2="160" y2="512"/><line x1="864" y1="512" x2="932" y2="512"/>
  </g>
  <circle cx="512" cy="430" r="60" fill="#f2a900"/>
</svg>
